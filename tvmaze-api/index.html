<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Showguide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0f1a2e;
    --deep: #0a1322;
    --panel: #16233c;
    --panel-2: #1c2c4a;
    --ink: #eef1f7;
    --muted: #8c9ab5;
    --line: rgba(238, 241, 247, 0.09);
    --amber: #f2b544;
    --amber-soft: rgba(242, 181, 68, 0.14);
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--body);
         font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  img { display: block; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 6px; }
  .hidden { display: none !important; }

  /* ---------- top bar ---------- */
  .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px;
         padding: 14px 40px; background: rgba(15, 26, 46, 0.82); backdrop-filter: blur(14px);
         border-bottom: 1px solid var(--line); }
  .logo { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em;
          display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
  .logo .lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--amber);
                box-shadow: 0 0 12px var(--amber); }
  .bar form { flex: 1; max-width: 460px; margin-left: auto; }
  .bar input { width: 100%; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line);
               background: var(--panel); outline: none; font-size: 15px; }
  .bar input:focus { border-color: var(--amber); }

  /* ---------- landing ---------- */
  .landing { position: relative; min-height: calc(100vh - 63px); display: flex; align-items: center;
             justify-content: center; overflow: hidden; }
  .wall { position: absolute; inset: -40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
          gap: 12px; transform: rotate(-6deg) scale(1.15); opacity: 0.32; }
  .wall img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; }
  .landing::after { content: ""; position: absolute; inset: 0;
                    background: radial-gradient(ellipse at center, rgba(15,26,46,0.55) 0%, var(--night) 72%); }
  .intro { position: relative; z-index: 2; text-align: center; padding: 40px 24px; max-width: 760px; }
  .intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(44px, 8vw, 92px);
              line-height: 0.95; letter-spacing: -0.045em; margin: 0 0 20px; }
  .intro p { color: var(--muted); font-size: 18px; margin: 0 auto 36px; max-width: 46ch; }
  .big-search { display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: var(--panel);
                border: 1px solid var(--line); box-shadow: 0 30px 80px rgba(0,0,0,0.45); }
  .big-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 12px 20px; font-size: 19px; }
  .big-search button { border: 0; border-radius: 999px; padding: 12px 28px; background: var(--amber);
                       color: #1a1204; font-weight: 600; cursor: pointer; }
  .picks { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; color: var(--muted); font-size: 14px; align-items: center; }
  .pick { border: 1px solid var(--line); background: rgba(22,35,60,0.7); border-radius: 999px;
          padding: 6px 14px; cursor: pointer; font-size: 14px; }
  .pick:hover { border-color: var(--amber); color: var(--amber); }

  /* ---------- status ---------- */
  .status { max-width: 640px; margin: 120px auto; text-align: center; padding: 0 24px; }
  .status h2 { font-family: var(--display); font-size: 34px; letter-spacing: -0.03em; margin: 0 0 8px; }
  .status p { color: var(--muted); margin: 0; }
  .spinner { width: 34px; height: 34px; margin: 0 auto 20px; border-radius: 50%;
             border: 3px solid var(--line); border-top-color: var(--amber); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- show hero ---------- */
  .hero { position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: -60px; background-size: cover; background-position: center 20%;
             filter: blur(42px) saturate(1.3); opacity: 0.55; }
  .hero::after { content: ""; position: absolute; inset: 0;
                 background: linear-gradient(180deg, rgba(15,26,46,0.35) 0%, var(--night) 100%); }
  .hero-inner { position: relative; z-index: 2; max-width: 1180px; margin: 0 auto; padding: 64px 40px 48px;
                display: grid; grid-template-columns: 250px 1fr; gap: 48px; align-items: end; }
  .poster { width: 250px; aspect-ratio: 2/3; object-fit: cover; border-radius: 14px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.55); background: var(--panel); }
  .hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 6.4vw, 84px);
             line-height: 0.95; letter-spacing: -0.045em; margin: 0 0 18px; }
  .facts { display: flex; flex-wrap: wrap; gap: 10px 22px; color: var(--muted); font-size: 15px; margin-bottom: 20px; }
  .facts strong { color: var(--ink); font-weight: 600; }
  .score { display: inline-flex; align-items: baseline; gap: 6px; }
  .score b { font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--amber); letter-spacing: -0.02em; }
  .hero .summary { max-width: 62ch; color: #cfd6e4; font-size: 16.5px; margin: 0; }
  .others { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 14px; }

  /* ---------- tabs ---------- */
  .tabs { position: sticky; top: 63px; z-index: 10; background: var(--night); border-bottom: 1px solid var(--line); }
  .tabs-inner { max-width: 1180px; margin: 0 auto; padding: 0 40px; display: flex; gap: 32px; }
  .tab { background: none; border: 0; padding: 18px 0 16px; cursor: pointer; color: var(--muted);
         font-weight: 500; font-size: 16px; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
  .tab small { color: var(--muted); font-size: 13px; margin-left: 4px; }

  .content { max-width: 1180px; margin: 0 auto; padding: 36px 40px 80px; }
  .section-title { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
  .section-note { color: var(--muted); margin: 0 0 24px; font-size: 15px; }

  /* episodes */
  .seasons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 26px; scrollbar-width: thin; }
  .season { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
            padding: 9px 16px; cursor: pointer; font-size: 15px; }
  .season:hover { border-color: rgba(242,181,68,0.5); }
  .season[aria-pressed="true"] { background: var(--amber); color: #1a1204; border-color: var(--amber); font-weight: 600; }
  .ep { display: grid; grid-template-columns: 56px 220px 1fr auto; gap: 24px; align-items: center;
        padding: 18px 0; border-bottom: 1px solid var(--line); }
  .ep:last-child { border-bottom: 0; }
  .ep-num { font-family: var(--display); font-size: 30px; font-weight: 600; color: var(--muted); text-align: center; }
  .ep-img { width: 220px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; background: var(--panel); }
  .ep h3 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  .ep .when { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .ep p { margin: 0; color: #b9c2d4; font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2;
          -webkit-box-orient: vertical; overflow: hidden; }
  .ep-rate { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--amber); min-width: 48px; text-align: right; }
  .ep-rate.none { color: var(--muted); font-size: 15px; font-family: var(--body); }

  /* cast */
  .cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 28px 22px; }
  .person img, .person .ph { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 12px; background: var(--panel); }
  .person .ph { display: flex; align-items: center; justify-content: center; font-family: var(--display);
                font-size: 44px; font-weight: 800; color: var(--muted); }
  .person h3 { margin: 12px 0 2px; font-size: 16px; font-weight: 600; }
  .person p { margin: 0; color: var(--muted); font-size: 14px; }

  /* ratings */
  .ratings-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .heat-wrap { overflow-x: auto; padding-bottom: 6px; }
  .heat { display: grid; gap: 4px; width: max-content; }
  .heat-row { display: flex; gap: 4px; align-items: center; }
  .heat-label { width: 70px; flex: none; color: var(--muted); font-size: 13px; }
  .cell { width: 31px; height: 31px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
          font-size: 11.5px; font-weight: 600; color: #101828; cursor: default; }
  .cell.empty { background: var(--panel); color: var(--muted); font-weight: 400; }
  .heat-head .cell { background: none; color: var(--muted); font-weight: 400; }
  .legend { display: flex; align-items: center; gap: 10px; margin-top: 18px; color: var(--muted); font-size: 13px; }
  .legend .scale { height: 8px; width: 160px; border-radius: 4px;
                   background: linear-gradient(90deg, rgb(44,62,102), rgb(242,181,68)); }
  .top { list-style: none; margin: 0; padding: 0; }
  .top li { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center;
            padding: 16px 0; border-bottom: 1px solid var(--line); }
  .top li:last-child { border-bottom: 0; }
  .rank { font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--muted); }
  .top li:first-child .rank { color: var(--amber); }
  .top h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .top span { color: var(--muted); font-size: 14px; }
  .top .val { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--amber); }

  /* api log */
  .how { max-width: 1180px; margin: 0 auto 60px; padding: 0 40px; }
  .how details { background: var(--deep); border: 1px solid var(--line); border-radius: 14px; }
  .how summary { cursor: pointer; padding: 18px 22px; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  .how summary::-webkit-details-marker { display: none; }
  .how summary span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .log { padding: 0 22px 20px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .log-line { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .log-line .code { color: #6fdc9a; } .log-line .code.bad { color: #ff8a80; }
  .log-line .url { word-break: break-all; }
  .log-line .why { display: block; color: var(--muted); font-family: var(--body); font-size: 13.5px; margin-top: 2px; }

  @media (max-width: 860px) {
    .bar { padding: 12px 18px; }
    .hero-inner { grid-template-columns: 1fr; padding: 40px 20px 32px; gap: 28px; }
    .poster { width: 170px; }
    .tabs-inner, .content, .how { padding-left: 20px; padding-right: 20px; }
    .ep { grid-template-columns: 1fr auto; gap: 10px 16px; }
    .ep-num { display: none; }
    .ep-img { width: 100%; grid-column: 1 / -1; }
    .ratings-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <button class="logo" id="home" aria-label="Back to start"><span class="lamp"></span>Showguide</button>
  <form id="topForm" class="hidden" role="search">
    <input id="topQ" type="search" placeholder="Search another show" aria-label="Search TV shows">
  </form>
</header>

<!-- Landing -->
<section class="landing" id="landing">
  <div class="wall" id="wall" aria-hidden="true"></div>
  <div class="intro">
    <h1>What are you watching tonight?</h1>
    <p>Type a TV show to see every episode, the cast, and which episodes fans rated highest.</p>
    <form class="big-search" id="bigForm" role="search">
      <input id="bigQ" type="search" placeholder="Search a TV show" aria-label="Search TV shows" autofocus>
      <button type="submit">Search</button>
    </form>
    <div class="picks">Try
      <button class="pick">Friends</button>
      <button class="pick">Breaking Bad</button>
      <button class="pick">The Office</button>
      <button class="pick">Stranger Things</button>
      <button class="pick">Game of Thrones</button>
    </div>
  </div>
</section>

<!-- Loading / errors -->
<section class="status hidden" id="status"></section>

<!-- Show page -->
<main id="showPage" class="hidden">
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-inner" id="heroInner"></div>
  </section>

  <nav class="tabs">
    <div class="tabs-inner" role="tablist">
      <button class="tab" role="tab" data-tab="episodes" aria-selected="true">Episodes <small id="cEp"></small></button>
      <button class="tab" role="tab" data-tab="cast" aria-selected="false">Cast <small id="cCast"></small></button>
      <button class="tab" role="tab" data-tab="ratings" aria-selected="false">Ratings</button>
    </div>
  </nav>

  <div class="content">
    <section id="tab-episodes"></section>
    <section id="tab-cast" class="hidden"></section>
    <section id="tab-ratings" class="hidden"></section>
  </div>
</main>

<!-- API log -->
<section class="how">
  <details id="howBox">
    <summary>How this page gets its data <span id="callCount">No API calls yet</span></summary>
    <div class="log" id="log"></div>
  </details>
</section>

<script>
const API = "https://api.tvmaze.com";
const $ = id => document.getElementById(id);
let state = { show: null, episodes: [], cast: [], season: null };
let calls = 0;

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function text(html) { const d = document.createElement("div"); d.innerHTML = html || ""; return d.textContent.trim(); }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
}
function initials(name) { return (name || "?").split(" ").map(w => w[0]).slice(0, 2).join(""); }

function logCall(status, url, why) {
  calls++;
  $("callCount").textContent = calls === 1 ? "1 API call" : `${calls} API calls`;
  $("log").insertAdjacentHTML("beforeend",
    `<div class="log-line"><span class="code ${status === 200 ? "" : "bad"}">${status}</span>
     <span class="url">GET ${esc(url)}<span class="why">${esc(why)}</span></span></div>`);
}
async function call(path, why) {
  const url = API + path;
  let res;
  try { res = await fetch(url); }
  catch (e) { logCall("ERR", url, "Network error: " + e.message); throw e; }
  logCall(res.status, url, why);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* ---------- views ---------- */
function view(name) {
  $("landing").classList.toggle("hidden", name !== "landing");
  $("status").classList.toggle("hidden", name !== "status");
  $("showPage").classList.toggle("hidden", name !== "show");
  $("topForm").classList.toggle("hidden", name === "landing");
  window.scrollTo(0, 0);
}
function status(title, msg, loading) {
  $("status").innerHTML = `${loading ? '<div class="spinner"></div>' : ""}<h2>${esc(title)}</h2><p>${esc(msg)}</p>`;
  view("status");
}

/* ---------- landing poster wall (one extra call, purely decorative) ---------- */
async function loadWall() {
  try {
    const shows = await call("/shows?page=1", "Popular shows for the background poster wall");
    const imgs = (shows || []).filter(s => s.image).sort((a, b) => b.weight - a.weight).slice(0, 60);
    $("wall").innerHTML = imgs.map(s => `<img src="${esc(s.image.medium)}" alt="" loading="lazy">`).join("");
  } catch (e) { /* the page works without the wall */ }
}

/* ---------- search flow ---------- */
async function search(name) {
  name = (name || "").trim();
  if (!name) return;
  status(`Looking up “${name}”`, "Asking TVmaze for this show…", true);
  try {
    // Call 1: name -> show (gives us the ID)
    const show = await call(`/singlesearch/shows?q=${encodeURIComponent(name)}`, "Step 1: turn the name into the show's ID");
    if (!show) {
      status(`No show called “${name}”`, "Check the spelling, or try the show's full title.", false);
      return;
    }
    await openShow(show, name);
  } catch (e) {
    status("TVmaze can't be reached", "Check your internet connection, then search again.", false);
  }
}

async function openShow(show, query) {
  status(show.name, "Loading episodes and cast…", true);
  // Calls 2 and 3 run at the same time, both using the ID from step 1
  const [episodes, cast, similar] = await Promise.all([
    call(`/shows/${show.id}/episodes`, `Step 2: use ID ${show.id} to get every episode`),
    call(`/shows/${show.id}/cast`, `Step 3: use ID ${show.id} to get the cast`),
    query ? call(`/search/shows?q=${encodeURIComponent(query)}`, "Other shows with a similar name").catch(() => null) : null
  ]);
  state = { show, episodes: episodes || [], cast: cast || [], season: null };
  const seasons = [...new Set(state.episodes.map(e => e.season))];
  state.season = seasons[0] ?? null;

  renderHero(show, (similar || []).map(r => r.show).filter(s => s.id !== show.id).slice(0, 5));
  renderEpisodes();
  renderCast();
  renderRatings();
  $("cEp").textContent = state.episodes.length || "";
  $("cCast").textContent = state.cast.length || "";
  selectTab("episodes");
  $("topQ").value = "";
  view("show");
}

/* ---------- renderers ---------- */
function renderHero(s, others) {
  const img = s.image ? (s.image.original || s.image.medium) : "";
  $("heroBg").style.backgroundImage = img ? `url("${img}")` : "none";
  const start = s.premiered ? s.premiered.slice(0, 4) : "";
  const end = s.ended ? s.ended.slice(0, 4) : (s.status === "Running" ? "now" : "");
  const network = s.network ? s.network.name : (s.webChannel ? s.webChannel.name : "");
  const seasons = new Set(state.episodes.map(e => e.season)).size;

  $("heroInner").innerHTML = `
    ${img ? `<img class="poster" src="${esc(s.image.medium)}" alt="${esc(s.name)} poster">` : `<div class="poster"></div>`}
    <div>
      <h1>${esc(s.name)}</h1>
      <div class="facts">
        ${s.rating && s.rating.average ? `<span class="score"><b>${s.rating.average}</b> / 10</span>` : ""}
        ${start ? `<span><strong>${start}${end ? "–" + end : ""}</strong></span>` : ""}
        ${seasons ? `<span><strong>${seasons}</strong> season${seasons > 1 ? "s" : ""}</span>` : ""}
        ${network ? `<span>${esc(network)}</span>` : ""}
        ${s.genres && s.genres.length ? `<span>${esc(s.genres.join(", "))}</span>` : ""}
      </div>
      <p class="summary">${esc(text(s.summary)) || "No description available for this show."}</p>
      ${others.length ? `<div class="others">Looking for another one?
        ${others.map((o, i) => `<button class="pick" data-i="${i}">${esc(o.name)}${o.premiered ? " (" + o.premiered.slice(0, 4) + ")" : ""}</button>`).join("")}
      </div>` : ""}
    </div>`;
  $("heroInner").querySelectorAll(".others .pick").forEach(b =>
    b.onclick = () => openShow(others[Number(b.dataset.i)], null));
}

function renderEpisodes() {
  const box = $("tab-episodes");
  if (!state.episodes.length) { box.innerHTML = `<p class="section-note">TVmaze has no episodes listed for this show yet.</p>`; return; }
  const seasons = [...new Set(state.episodes.map(e => e.season))];
  const list = state.episodes.filter(e => e.season === state.season);
  box.innerHTML = `
    <div class="seasons" role="group" aria-label="Choose a season">
      ${seasons.map(n => `<button class="season" data-s="${n}" aria-pressed="${n === state.season}">Season ${n}</button>`).join("")}
    </div>
    ${list.map(e => `
      <article class="ep">
        <div class="ep-num">${e.number ?? "–"}</div>
        ${e.image ? `<img class="ep-img" src="${esc(e.image.medium)}" alt="" loading="lazy">` : `<div class="ep-img"></div>`}
        <div>
          <h3>${esc(e.name)}</h3>
          <div class="when">${fmtDate(e.airdate)}${e.runtime ? `, ${e.runtime} min` : ""}</div>
          ${e.summary ? `<p>${esc(text(e.summary))}</p>` : ""}
        </div>
        ${e.rating && e.rating.average ? `<div class="ep-rate">${e.rating.average}</div>` : `<div class="ep-rate none">No rating</div>`}
      </article>`).join("")}`;
  box.querySelectorAll(".season").forEach(b => b.onclick = () => { state.season = Number(b.dataset.s); renderEpisodes(); });
}

function renderCast() {
  const box = $("tab-cast");
  if (!state.cast.length) { box.innerHTML = `<p class="section-note">TVmaze has no cast listed for this show.</p>`; return; }
  box.innerHTML = `<div class="cast">${state.cast.map(m => {
    const p = m.person || {}, c = m.character || {};
    const img = p.image ? `<img src="${esc(p.image.medium)}" alt="${esc(p.name)}" loading="lazy">` : `<div class="ph">${esc(initials(p.name))}</div>`;
    return `<div class="person">${img}<h3>${esc(p.name)}</h3><p>${esc(c.name)}</p></div>`;
  }).join("")}</div>`;
}

function heatColor(r) {
  // 6.5 or lower = cool slate, 9.5 or higher = full amber
  const t = Math.max(0, Math.min(1, (r - 6.5) / 3));
  const a = [44, 62, 102], b = [242, 181, 68];   // slate blue -> amber, mixed in RGB (no green detour)
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return { bg: `rgb(${c.join(",")})`, fg: t > 0.55 ? "#1a1204" : "#eef1f7" };
}

function renderRatings() {
  const box = $("tab-ratings");
  const rated = state.episodes.filter(e => e.rating && e.rating.average != null);
  if (!rated.length) { box.innerHTML = `<p class="section-note">Fans haven't rated this show's episodes on TVmaze yet.</p>`; return; }

  const seasons = [...new Set(state.episodes.map(e => e.season))];
  const maxEp = Math.max(...state.episodes.map(e => e.number || 0));
  const head = `<div class="heat-row heat-head"><div class="heat-label"></div>${
    Array.from({ length: maxEp }, (_, i) => `<div class="cell">${i + 1}</div>`).join("")}</div>`;
  const rows = seasons.map(sn => {
    const cells = Array.from({ length: maxEp }, (_, i) => {
      const e = state.episodes.find(x => x.season === sn && x.number === i + 1);
      if (!e) return `<div class="cell empty"></div>`;
      const r = e.rating && e.rating.average;
      if (r == null) return `<div class="cell empty" title="${esc(e.name)}: no rating">–</div>`;
      const c = heatColor(r);
      return `<div class="cell" style="background:${c.bg};color:${c.fg}" title="S${sn} E${e.number}: ${esc(e.name)} (${r})">${r}</div>`;
    }).join("");
    return `<div class="heat-row"><div class="heat-label">Season ${sn}</div>${cells}</div>`;
  }).join("");

  const top = [...rated].sort((a, b) => b.rating.average - a.rating.average).slice(0, 5);

  box.innerHTML = `
    <div class="ratings-grid">
      <div>
        <h2 class="section-title">Every episode, rated</h2>
        <p class="section-note">Each square is one episode. Brighter means fans rated it higher. Hover a square for its title.</p>
        <div class="heat-wrap"><div class="heat">${head}${rows}</div></div>
        <div class="legend">Lower <span class="scale"></span> Higher</div>
      </div>
      <div>
        <h2 class="section-title">Top 5 episodes</h2>
        <p class="section-note">Worked out from the episode list, no extra API call.</p>
        <ol class="top">${top.map((e, i) => `
          <li><div class="rank">${i + 1}</div>
              <div><h3>${esc(e.name)}</h3><span>Season ${e.season}, episode ${e.number}</span></div>
              <div class="val">${e.rating.average}</div></li>`).join("")}
        </ol>
      </div>
    </div>`;
}

/* ---------- tabs & events ---------- */
function selectTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
  ["episodes", "cast", "ratings"].forEach(n => $("tab-" + n).classList.toggle("hidden", n !== name));
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => selectTab(t.dataset.tab));
$("bigForm").addEventListener("submit", e => { e.preventDefault(); search($("bigQ").value); });
$("topForm").addEventListener("submit", e => { e.preventDefault(); search($("topQ").value); });
document.querySelectorAll(".intro .pick").forEach(b => b.onclick = () => search(b.textContent));
$("home").onclick = () => { $("bigQ").value = ""; view("landing"); $("bigQ").focus(); };

loadWall();
</script>
